<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerson Patrick Kiondo - Software Developer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
* {margin:0; padding:0; box-sizing:border-box;}
body {font-family:'Roboto',sans-serif; background:#f4f4f4; color:#333; scroll-behavior:smooth; overflow-x:hidden;}
header {position:fixed; top:0; width:100%; background:#1a1a1a; color:#fff; padding:20px 0; text-align:center; z-index:1000;}
header nav a {color:#fff; margin:0 15px; text-decoration:none; font-weight:700; transition:color 0.3s;}
header nav a:hover {color:#61dafb;}
section {padding:120px 20px; max-width:1000px; margin:auto;}
#hero {background:#282c34; color:#fff; text-align:center; padding-top:180px; padding-bottom:100px; position:relative;}
#hero h1 {font-size:3rem; margin-bottom:20px; opacity:0; transform:translateY(50px); transition:all 1s ease;}
#hero p {font-size:1.2rem; opacity:0; transform:translateY(50px); transition:all 1s ease 0.3s;}
#projects {background:#fff;}
#projects h2 {text-align:center; margin-bottom:50px; font-size:2.5rem; opacity:0; transform:translateY(50px); transition:all 1s ease;}
.project-list {display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:30px;}
.project {background:#eee; padding:20px; border-radius:10px; transition:all 0.5s ease; opacity:0; transform:translateY(50px);}
.project:hover {transform: translateY(-10px);}
.project a {text-decoration:none; color:#1a1a1a; font-weight:700;}
#contact {background:#282c34; color:#fff; text-align:center;}
#contact h2 {margin-bottom:30px; opacity:0; transform:translateY(50px); transition:all 1s ease;}
footer {text-align:center; padding:20px; background:#1a1a1a; color:#fff;}

/* Scroll animation classes */
.fade-in {opacity:1 !important; transform:translateY(0) !important;}
</style>
</head>
<body>

<header>
<nav>
<a href="#hero">Home</a>
<a href="#projects">Projects</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section id="hero">
<h1>Emerson Patrick Kiondo</h1>
<p>Software Developer</p>
</section>

<section id="projects">
<h2>Projects</h2>
<div class="project-list" id="project-list">
<!-- Projects will load here -->
</div>
</section>

<section id="contact">
<h2>Contact Me</h2>
<p>Email: emersonpkiondo79@gmail.com</p>
<p>Phone: 0783029233 | 0741219233 | 0741129233</p>
<p>LinkedIn: <a href="https://www.linkedin.com/in/emerson-patrick-601910219" style="color:#61dafb;">View Profile</a></p>
</section>

<footer>
&copy; 2025 Emerson Patrick Kiondo
</footer>

<script>
// Scroll animation
const animatedElements = document.querySelectorAll('#hero h1, #hero p, #projects h2, .project, #contact h2');
function scrollAnimation() {
  const triggerBottom = window.innerHeight * 0.85;
  animatedElements.forEach(el => {
    const boxTop = el.getBoundingClientRect().top;
    if(boxTop < triggerBottom) {
      el.classList.add('fade-in');
    }
  });
}
window.addEventListener('scroll', scrollAnimation);
window.addEventListener('load', scrollAnimation);

// Fetch GitHub projects
const githubUser = 'Emersonhacker029233';
const projectList = document.getElementById('project-list');

fetch(`https://api.github.com/users/${githubUser}/repos`)
.then(response => response.json())
.then(data => {
    // Sort repos by last updated
    data.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
    data.forEach(repo => {
        const project = document.createElement('div');
        project.classList.add('project');
        project.innerHTML = `
        <h3>${repo.name}</h3>
        <p>${repo.description ? repo.description : 'No description'}</p>
        <a href="${repo.html_url}" target="_blank">View Repository</a>
        `;
        projectList.appendChild(project);
    });
})
.catch(err => console.error(err));

// Smooth fade-in for hero on load
window.addEventListener('load', () => {
  document.querySelector('#hero h1').classList.add('fade-in');
  document.querySelector('#hero p').classList.add('fade-in');
});
</script>

</body>
</html>
